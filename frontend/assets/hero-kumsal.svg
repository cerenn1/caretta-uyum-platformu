<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero illustrasyonu - kumsal & deniz, caretta caretta temali.
  Elle cizilmis SVG: telif sorunu yok, birkac KB, ve renkleri sayfa paletiyle
  birebir ayni tonlardan secildi (yumusak/pastel, sert kontrast yok).
  Genis viewBox + preserveAspectRatio="slice" ile arka plan olarak kirpilarak kullanilir.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Kumsal ve deniz illustrasyonu">
  <defs>
    <linearGradient id="gokyuzu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8f4"/>
      <stop offset="60%" stop-color="#e4f2f6"/>
      <stop offset="100%" stop-color="#f2f7f3"/>
    </linearGradient>
    <linearGradient id="denizUzak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ed4dc"/>
      <stop offset="100%" stop-color="#b7e0e4"/>
    </linearGradient>
    <linearGradient id="denizYakin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74c2c6"/>
      <stop offset="100%" stop-color="#8fd0d1"/>
    </linearGradient>
    <linearGradient id="kumsal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e6cd"/>
      <stop offset="100%" stop-color="#e9d7b4"/>
    </linearGradient>
    <radialGradient id="gunes" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9d9bd"/>
      <stop offset="100%" stop-color="#f4c3a4"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="560" fill="url(#gokyuzu)"/>
  <circle cx="1140" cy="130" r="62" fill="url(#gunes)" opacity="0.9"/>
  <circle cx="1140" cy="130" r="96" fill="#f7d2b8" opacity="0.18"/>

  <!-- Uzak tepeler -->
  <path d="M0 300 Q 160 244 320 292 T 640 286 Q 800 246 960 290 T 1440 280 L1440 340 L0 340 Z" fill="#bcd9c9" opacity="0.55"/>

  <!-- Deniz katmanlari -->
  <path d="M0 318 Q 240 300 480 316 T 960 314 T 1440 306 L1440 430 L0 430 Z" fill="url(#denizUzak)"/>
  <path d="M0 372 Q 240 352 480 370 T 960 366 T 1440 358 L1440 470 L0 470 Z" fill="url(#denizYakin)"/>

  <!-- Kopukler -->
  <path d="M0 430 Q 180 414 360 430 T 720 428 T 1080 430 T 1440 424" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <path d="M0 452 Q 200 438 400 452 T 800 450 T 1200 452 T 1440 446" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="4" stroke-linecap="round"/>

  <!-- Kumsal -->
  <path d="M0 462 Q 240 446 480 462 T 960 460 T 1440 454 L1440 560 L0 560 Z" fill="url(#kumsal)"/>

  <!-- Kum dokusu (hafif noktalar) -->
  <g fill="#d9c39a" opacity="0.45">
    <circle cx="190" cy="512" r="3"/><circle cx="268" cy="536" r="2.4"/><circle cx="352" cy="504" r="2.6"/>
    <circle cx="612" cy="528" r="3"/><circle cx="700" cy="500" r="2.2"/><circle cx="806" cy="534" r="2.8"/>
    <circle cx="1042" cy="510" r="2.6"/><circle cx="1150" cy="536" r="3"/><circle cx="1290" cy="506" r="2.4"/>
  </g>

  <!-- Yuva isaretleri (kucuk konik kum tepecikleri) -->
  <g opacity="0.8">
    <path d="M300 520 q 22 -22 44 0 z" fill="#dcc59c"/>
    <path d="M980 508 q 18 -18 36 0 z" fill="#dcc59c"/>
  </g>

  <!-- Caretta caretta silueti - kumsalda denize dogru -->
  <g transform="translate(400 502) scale(1.3)" fill="#2f6f72">
    <ellipse cx="0" cy="0" rx="30" ry="20"/>
    <ellipse cx="0" cy="0" rx="21" ry="13" fill="#3b8184"/>
    <circle cx="34" cy="-3" r="8"/>
    <path d="M-24 -16 q -18 -12 -30 -2 q 12 6 26 10 z"/>
    <path d="M-24 16 q -18 12 -30 2 q 12 -6 26 -10 z"/>
    <path d="M20 -17 q 14 -12 26 -6 q -10 8 -20 12 z"/>
    <path d="M20 17 q 14 12 26 6 q -10 -8 -20 -12 z"/>
    <circle cx="37" cy="-5" r="1.6" fill="#f2e6cd"/>
  </g>
</svg>
