spring.application.name=proje

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/caretta_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:caretta}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:caretta_dev_sifresi}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRES_IN:7d}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

uploads.kapanis-kaniti-dir=${UPLOAD_DIR:uploads/kapanis-kanitlari}
uploads.yuva-kaydi-dir=${UPLOAD_DIR_YUVA:uploads/yuva-kayitlari}

# Koltuk bazli uyelik - Stripe Checkout (TEST/SANDBOX modu). Kullanici henuz gercek
# bir Stripe hesabi/anahtari olusturmadigi icin bu degerler .env'de bos kalabilir;
# Session.create() cagrilana kadar uygulama bundan etkilenmez.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.koltuk-birim-fiyati-usd-cent=${STRIPE_KOLTUK_BIRIM_FIYATI_CENT:1500}
stripe.basari-url=${STRIPE_BASARI_URL:http://localhost:5500/odeme-basarili.html}
stripe.iptal-url=${STRIPE_IPTAL_URL:http://localhost:5500/odeme-iptal.html}

# Demo amacli manuel premium isaretleme araci (gercek admin-rol sistemi DEGIL) icin
# paylasilan gizli anahtar - bos birakilirsa endpoint HER ZAMAN reddeder (bkz. UyelikService).
admin.api-key=${ADMIN_API_KEY:}

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
