spring.datasource.url=jdbc:postgresql://localhost:5433/caretta_db
spring.datasource.username=caretta
spring.datasource.password=caretta_dev_sifresi
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
