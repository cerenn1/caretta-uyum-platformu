# Test profili: mevcut lokal docker-compose Postgres'ine (host'tan 5433 portu) baglanir.
# Onemli: paylasilan dev veritabani kullanildigi icin testler @Transactional olarak
# yazilmalidir ki her test sonunda rollback ile veri temizlensin.

spring.datasource.url=jdbc:postgresql://localhost:5433/caretta_db
spring.datasource.username=caretta
spring.datasource.password=caretta_dev_sifresi
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=test-ortami-icin-sadece-testlerde-kullanilan-cok-uzun-bir-gizli-anahtar-1234567890
jwt.expiration=1h

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

uploads.kapanis-kaniti-dir=target/test-uploads/kapanis-kanitlari
uploads.yuva-kaydi-dir=target/test-uploads/yuva-kayitlari

# Stripe secret-key BILEREK bos - testler gercek Stripe API'sine baglanmaz (yetki
# testleri Stripe cagrisindan ONCE 403 ile reddedilir). webhook-secret ise imza
# dogrulama testlerinde (StripeOdemeServisiTest, gecerli/gecersiz imza) kullanilir.
stripe.secret-key=
stripe.webhook-secret=test-ortami-icin-sadece-testlerde-kullanilan-webhook-gizli-anahtari
stripe.koltuk-birim-fiyati-usd-cent=1500
stripe.basari-url=http://localhost:5500/odeme-basarili.html
stripe.iptal-url=http://localhost:5500/odeme-iptal.html

admin.api-key=test-ortami-admin-anahtari-1234567890

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
