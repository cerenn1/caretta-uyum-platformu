services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caretta-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/caretta_db
      SPRING_DATASOURCE_USERNAME: caretta
      SPRING_DATASOURCE_PASSWORD: caretta_dev_sifresi
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgis/postgis:16-3.4
    container_name: caretta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caretta
      POSTGRES_PASSWORD: caretta_dev_sifresi
      POSTGRES_DB: caretta_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: caretta-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
